<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniStore | Premium Automation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Kufi Arabic', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Kufi Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="p-6 bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg"></div>
                <span class="text-2xl font-black tracking-tighter">Cogni<span class="text-indigo-600">Store</span></span>
            </div>
            <div class="space-x-4 space-x-reverse">
                <button class="font-bold text-slate-600">English</button>
                <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">ابدأ الآن</button>
            </div>
        </div>
    </nav>

    <header class="py-20 text-center">
        <h1 class="text-6xl font-black text-slate-900 mb-4">متجر <span class="text-indigo-600">CogniStore</span></h1>
        <p class="text-xl text-slate-500">ذكاء اصطناعي يفهم عملك.</p>
    </header>
    </body>
</html>
